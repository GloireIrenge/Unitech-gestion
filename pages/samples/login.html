<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>UNITECH - Connexion</title>
  <link rel="stylesheet" href="../../assets/vendors/typicons/typicons.css">
  <link rel="stylesheet" href="../../assets/vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="../../assets/css/style.css">
  <link rel="shortcut icon" href="../../assets/images/favicon.ico" />
  <style>
    :root {
      --unitech-blue: #5d8cf4;
      --unitech-blue-dark: #1d3968;
      --unitech-yellow: #f4dc61;
      --unitech-navy: #112a50;
      --unitech-bg: #edf4ff;
      --unitech-card: #ffffff;
      --unitech-text: #1d2b3a;
      --unitech-muted: #64748b;
    }
    body {
      background: linear-gradient(135deg, rgba(93,140,244,0.14), rgba(244,220,97,0.14));
      font-family: "Poppins", sans-serif;
    }
    .auth-wrapper {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .auth-card {
      width: min(100%, 460px);
      background: rgba(255,255,255,0.94);
      border: 1px solid rgba(29,57,104,0.1);
      border-radius: 22px;
      box-shadow: 0 18px 45px rgba(17,42,80,0.08);
      overflow: hidden;
    }
    .auth-top {
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--unitech-blue-dark), var(--unitech-navy));
      padding: 26px 20px 18px;
    }
    .auth-top img {
      width: 160px;
      height: auto;
    }
    .auth-body {
      padding: 28px 28px 22px;
    }
    .eyebrow {
      color: var(--unitech-blue-dark);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    h4 {
      margin: 0 0 6px;
      color: var(--unitech-blue-dark);
      font-weight: 800;
      font-size: 2rem;
    }
    .subtitle {
      color: var(--unitech-muted);
      margin-bottom: 18px;
    }
    .form-label {
      color: var(--unitech-text);
      font-weight: 600;
      margin-bottom: 8px;
    }
    .form-control {
      border-radius: 12px;
      border: 1px solid rgba(29,57,104,0.15);
      padding: 0.9rem 1rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--unitech-blue), var(--unitech-blue-dark));
      border: none;
      border-radius: 12px;
      font-weight: 700;
      padding: 0.9rem 1rem;
    }
    .auth-link {
      color: var(--unitech-blue-dark);
      font-weight: 600;
    }
    .tiny {
      font-size: 0.78rem;
      color: var(--unitech-muted);
    }
  </style>
</head>

<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-top">
        <img src="../../assets/images/logo.jpg" alt="UNITECH logo">
      </div>
      <div class="auth-body">
        <div class="eyebrow">Portail académique</div>
        <h4>Connexion</h4>
        <p class="subtitle">Accédez à votre espace UNITECH.</p>

        <form id="loginForm">
          <div class="form-group mb-3">
            <label class="form-label" for="matricule">Numéro matricule</label>
            <input type="text" class="form-control form-control-lg" id="matricule" name="matricule" placeholder="UNT-2024-0837" required>
          </div>
          <div class="form-group mb-3">
            <label class="form-label" for="password">Mot de passe</label>
            <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
          </div>
          <div class="form-check mb-3">
            <label class="form-check-label text-muted">
              <input type="checkbox" class="form-check-input" name="remember">
              Garder ma session active
            </label>
          </div>
          <div class="mt-3 d-grid gap-2">
            <button type="submit" class="btn btn-block btn-primary btn-lg fw-medium auth-form-btn">Se connecter</button>
          </div>
          <div class="text-center mt-4 tiny">
            Vous n'avez pas de compte ? <a href="register.html" class="auth-link">Créer un accès</a>
          </div>
          <div class="text-center mt-2 tiny">
            <a href="#" class="auth-link">Mot de passe oublié ?</a>
          </div>
        </form>
        <script>
          const loginForm = document.getElementById('loginForm');
          loginForm.addEventListener('submit', function (event) {
            event.preventDefault();
            const matricule = document.getElementById('matricule').value.trim();
            const password = document.getElementById('password').value.trim();
            if (!matricule || !password) {
              alert('Veuillez remplir votre matricule et votre mot de passe.');
              return;
            }
            const profile = matricule.toLowerCase().includes('admin') ? 'administrateur' : 'étudiant';
            const fullName = profile === 'administrateur' ? 'Dr. Élodie Ndayisaba' : 'Amélie Ndayisaba';
            localStorage.setItem('unitechUser', JSON.stringify({
              name: fullName,
              profile,
              matricule,
              loggedInAt: new Date().toISOString()
            }));
            window.location.href = '../../index.html';
          });
        </script>
      </div>
    </div>
  </div>

  <script>
    window.location.replace('login.php');
  </script>
</body>

</html>
